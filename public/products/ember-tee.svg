<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="ember-tee">
  <defs>
    <linearGradient id="bg-ember-tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6ddd2"/>
      <stop offset="100%" stop-color="#bfb3a5"/>
    </linearGradient>
    <!-- Fully opaque stops: an alpha stop here would let the backdrop
         show through the garment and dissolve the hem. -->
    <linearGradient id="fabric-ember-tee" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#b8412f"/>
      <stop offset="55%" stop-color="#9c3327"/>
      <stop offset="100%" stop-color="#5a1912"/>
    </linearGradient>
    <filter id="soft-ember-tee" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <radialGradient id="sheen-ember-tee" cx="0.42" cy="0.3" r="0.62">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tee-ember-tee"><path d="M338 206 C300 214 262 230 236 250 C214 292 198 344 190 386 C214 404 244 416 272 420 C282 396 292 372 300 352 C296 480 296 660 300 806 C368 816 632 816 700 806 C704 660 704 480 700 352 C708 372 718 396 728 420 C756 416 786 404 810 386 C802 344 786 292 764 250 C738 230 700 214 662 206 C650 260 592 290 500 290 C408 290 350 260 338 206 Z"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg-ember-tee)"/>

  <!-- soft floor shadow so the garment sits in the frame -->
  <ellipse cx="500" cy="812" rx="235" ry="26" fill="#000" opacity="0.20"/>

  <g>
    <path d="M338 206 C300 214 262 230 236 250 C214 292 198 344 190 386 C214 404 244 416 272 420 C282 396 292 372 300 352 C296 480 296 660 300 806 C368 816 632 816 700 806 C704 660 704 480 700 352 C708 372 718 396 728 420 C756 416 786 404 810 386 C802 344 786 292 764 250 C738 230 700 214 662 206 C650 260 592 290 500 290 C408 290 350 260 338 206 Z" fill="url(#fabric-ember-tee)" stroke="#3d100b" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M338 206 C352 248 414 270 500 270 C586 270 648 248 662 206 C632 192 570 184 500 184 C430 184 368 192 338 206 Z" fill="#8a2b20"/>
    <path d="M338 206 C352 248 414 270 500 270 C586 270 648 248 662 206 C632 192 570 184 500 184 C430 184 368 192 338 206 Z" fill="none" stroke="#5a1912" stroke-opacity="0.5" stroke-width="4"/>

    <g clip-path="url(#tee-ember-tee)">
      <rect width="1000" height="1000" fill="url(#sheen-ember-tee)"/>
      <!-- Fabric folds: wide, very soft, and low on the body. Kept faint
           and blurred on purpose, because crisp dark strokes here read as
           scratches on the artwork rather than as cloth. -->
      <g filter="url(#soft-ember-tee)">
        <path d="M352 566 C368 646 362 726 346 800" stroke="#5a1912" stroke-opacity="0.20" stroke-width="30" fill="none" stroke-linecap="round"/>
        <path d="M648 566 C632 646 638 726 654 800" stroke="#5a1912" stroke-opacity="0.20" stroke-width="30" fill="none" stroke-linecap="round"/>
        <path d="M500 640 C494 700 496 752 500 800" stroke="#5a1912" stroke-opacity="0.12" stroke-width="22" fill="none" stroke-linecap="round"/>
      </g>
      <!-- sleeve hems -->
      <path d="M272 420 C288 402 296 378 300 352" stroke="#5a1912" stroke-opacity="0.22" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M728 420 C712 402 704 378 700 352" stroke="#5a1912" stroke-opacity="0.22" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- hem -->
      <path d="M300 788 C400 798 600 798 700 788" stroke="#5a1912" stroke-opacity="0.28" stroke-width="6" fill="none"/>
    </g>

    <!-- chest graphic -->
    <g transform="translate(500 470)" fill="#f8e7d8" stroke="#f8e7d8">
    <g stroke-width="7" stroke-linecap="round">
      <line x1="52.0" y1="0.0" x2="108.0" y2="0.0"/>
      <line x1="48.0" y1="19.9" x2="77.6" y2="32.1"/>
      <line x1="36.8" y1="36.8" x2="76.4" y2="76.4"/>
      <line x1="19.9" y1="48.0" x2="32.1" y2="77.6"/>
      <line x1="0.0" y1="52.0" x2="0.0" y2="108.0"/>
      <line x1="-19.9" y1="48.0" x2="-32.1" y2="77.6"/>
      <line x1="-36.8" y1="36.8" x2="-76.4" y2="76.4"/>
      <line x1="-48.0" y1="19.9" x2="-77.6" y2="32.1"/>
      <line x1="-52.0" y1="0.0" x2="-108.0" y2="0.0"/>
      <line x1="-48.0" y1="-19.9" x2="-77.6" y2="-32.1"/>
      <line x1="-36.8" y1="-36.8" x2="-76.4" y2="-76.4"/>
      <line x1="-19.9" y1="-48.0" x2="-32.1" y2="-77.6"/>
      <line x1="-0.0" y1="-52.0" x2="-0.0" y2="-108.0"/>
      <line x1="19.9" y1="-48.0" x2="32.1" y2="-77.6"/>
      <line x1="36.8" y1="-36.8" x2="76.4" y2="-76.4"/>
      <line x1="48.0" y1="-19.9" x2="77.6" y2="-32.1"/>
    </g>
    <circle cx="0" cy="0" r="38" fill="none" stroke-width="7"/>
    <text x="0" y="14" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="700" stroke="none">01</text>
    <text x="0" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" letter-spacing="8" stroke="none">LIMITED</text></g>
  </g>
</svg>
